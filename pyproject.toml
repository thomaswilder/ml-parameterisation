[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_model_ai4pex"
version = "1.0.0"
description = "CNN/U-Net models for the prediction of Eddy Kinetic Energy"
readme = "README.md"
authors = [
    {name = "Thomas Wilder", email = "tmwilder@outlook.com"}
]
requires-python = ">=3.9"
dependencies = [
    "tensorflow",
    "tensorboard",
    "keras",
    "xarray[io]",
    "xbatcher",
    "numpy",
    "pyyaml",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python"
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/thomaswilder/ml-parameterisation"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_model_ai4pex*"]
